# ==============================================================================
# Nagios Command Definitions for StackPilot
# ==============================================================================

# Standard host alive check (ICMP ping)
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 1
}

# Standard ping command
define command {
    command_name    check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,60% -c 5000.0,100% -p 5
}

# SSH availability command
define command {
    command_name    check_ssh
    command_line    $USER1$/check_ssh -H $HOSTADDRESS$ -p $ARG1$
}

# Standard HTTP application health check
define command {
    command_name    check_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -t 10
}

# NRPE command execution on remote dedicated EC2 instance (port 5666)
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -t 15
}

# NRPE with single argument
define command {
    command_name    check_nrpe_arg
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -a $ARG2$ -t 15
}

