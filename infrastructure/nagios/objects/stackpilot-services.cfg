# ==============================================================================
# Service Template Associations for StackPilot Dedicated EC2 Instances
# ==============================================================================
# These baseline services automatically bind to all hosts in the
# 'stackpilot-dedicated-hosts' hostgroup unless individually overridden.

# Service 1: Host Reachability via Ping
define service {
    use                     stackpilot-service
    hostgroup_name          stackpilot-dedicated-hosts
    service_description     PING
    check_command           check_ping
}

# Service 2: SSH Port 22 Connectivity
define service {
    use                     stackpilot-service
    hostgroup_name          stackpilot-dedicated-hosts
    service_description     SSH
    check_command           check_ssh!22
}

# Service 3: Root Disk Utilization (via NRPE)
define service {
    use                     stackpilot-service
    hostgroup_name          stackpilot-dedicated-hosts
    service_description     Disk Utilization
    check_command           check_nrpe!check_disk
}

# Service 4: CPU Load (via NRPE)
define service {
    use                     stackpilot-service
    hostgroup_name          stackpilot-dedicated-hosts
    service_description     CPU Load
    check_command           check_nrpe!check_load
}

# Service 5: Memory Usage (via NRPE)
define service {
    use                     stackpilot-service
    hostgroup_name          stackpilot-dedicated-hosts
    service_description     Memory Utilization
    check_command           check_nrpe!check_mem
}

# Service 6: Docker Daemon Status (via NRPE)
define service {
    use                     stackpilot-service
    hostgroup_name          stackpilot-dedicated-hosts
    service_description     Docker Daemon
    check_command           check_nrpe!check_docker
}

