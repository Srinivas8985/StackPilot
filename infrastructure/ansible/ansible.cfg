[defaults]
inventory = inventories
roles_path = roles
remote_user = ubuntu
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
timeout = 30
deprecation_warnings = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null

